<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouran Ayman - Happy New Year</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="overlay"></div>

    <div class="content">
      <div class="top-text">✨ A little surprise for you ✨</div>

      <div class="cake-area">
        <div class="cake">
          <div class="cake-top">
            <div class="name">Nouran Ayman</div>
            <div class="heart">♥</div>

            <div class="candles">
              <button class="candle" aria-label="Candle">
                <span class="flame"></span>
                <span class="wick"></span>
              </button>
              <button class="candle" aria-label="Candle">
                <span class="flame"></span>
                <span class="wick"></span>
              </button>
              <button class="candle" aria-label="Candle">
                <span class="flame"></span>
                <span class="wick"></span>
              </button>
              <button class="candle" aria-label="Candle">
                <span class="flame"></span>
                <span class="wick"></span>
              </button>
              <button class="candle" aria-label="Candle">
                <span class="flame"></span>
                <span class="wick"></span>
              </button>
            </div>
          </div>

          <div class="cake-body">
            <div class="cream cream1"></div>
            <div class="cream cream2"></div>
            <div class="cream cream3"></div>
            <div class="ribbon"></div>
          </div>
        </div>
      </div>

      <p class="hint" id="hint">Tap the candles to make a wish 🕯️</p>

      <div class="message" id="message">
        <div class="sparkles">✨ 💗 ✨</div>
        <p>Happy New Year, my love,<br>
        and I wish you 100 years of happiness always</p>
        <div class="small-name">Nouran Ayman ♡</div>
      </div>

      <button class="again" id="again">Light the candles again 🕯️</button>
    </div>

    <div id="confetti"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
